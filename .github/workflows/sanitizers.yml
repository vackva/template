name: sanitizers

# ASan+UBSan, TSan and RTSan legs over .github/sanitizer_matrix.json. The preset
# selects the sanitizer (TPL_SANITIZERS); reusable-sanitizer.yml sets the
# *SAN_OPTIONS that make findings fail the job. RTSan checks every
# TPL_NONBLOCKING function at runtime (Clang >= 20, which the workflow pins).

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    uses: ./.github/workflows/reusable-sanitizer.yml
    with:
      matrix_file: .github/sanitizer_matrix.json
      models_cache_prefix: stt-models
      models_hash_glob: models/*/manifest.json
      models_cache_paths: models/*/*.onnx
      models_lfs_include: "models/**/*.onnx"

  result:
    name: sanitizer result
    needs: sanitize
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.sanitize.result }}"
          [ "${{ needs.sanitize.result }}" = "success" ]
