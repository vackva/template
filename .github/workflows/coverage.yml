name: coverage

# Full-suite coverage. The pipeline is reusable-coverage.yml: build the
# ci-tests-coverage preset (clang -fprofile-instr-generate -fcoverage-mapping),
# run ctest, merge the profiles, export lcov over libtpl_dsp.so + test_* binaries,
# upload to Codecov (tokenless OIDC).
#
# On pull requests this is a gate: every changed file under src/ or include/ needs
# >= 80% line coverage (.github/scripts/coverage_gate.py, table in the job summary).
# Codecov additionally reports patch coverage against 80% (codecov.yml).

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: ./.github/workflows/reusable-coverage.yml
    permissions:
      contents: read
      id-token: write # Codecov's tokenless OIDC upload
    with:
      preset: ci-tests-coverage
      lib_pattern: "libtpl_*.so*"
      ignore_regex: "(^|/)(build|modules|extras|test|examples|_deps|third_party)/"
      models_cache_prefix: stt-models
      models_hash_glob: models/*/manifest.json
      models_cache_paths: models/*/*.onnx
      models_lfs_include: "models/**/*.onnx"
      min_file_coverage: "80"

  result:
    name: coverage result
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.coverage.result }}"
          [ "${{ needs.coverage.result }}" = "success" ]
