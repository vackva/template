name: build_test

# Desktop build + test. The logic is reusable-build-test.yml; this file holds the
# facts: triggers and the matrix file. Pull requests run the "pr": true rows of
# .github/build_test_matrix.json, everything else runs every row.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tier:
        description: "Matrix tier: 'full' (default) or 'pr'"
        type: string
        default: "full"
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier"
        type: choice
        options: ["full", "pr"]
        default: "full"

concurrency:
  group: build_test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: build_test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      tier: ${{ inputs.tier || '' }}
      matrix_file: .github/build_test_matrix.json

  # The one status branch protection requires; called jobs report under a prefixed
  # name ("build_test / build_test result"), this keeps the exact context.
  result:
    name: build_test result
    needs: build_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.build_test.result }}"
          [ "${{ needs.build_test.result }}" = "success" ]
