name: build-test

# Reusable desktop build+test over a caller-side matrix file and CMake presets.
# The caller keeps only its facts (triggers, the matrix JSON, presets, cache
# config); the logic lives here once, in the repo it runs for.
#
# Matrix rows: { name, os, preset, args?, pr?, vcvars?, assert_grep?, dualarch?,
#                build_only? }
#   pr: true      -> included in the pull_request tier (other events run all rows)
#   vcvars        -> arch for ilammy/msvc-dev-cmd (Ninja needs cl.exe from vcvars)
#   assert_grep   -> literal (grep -F) asserted in configure.log after the
#                    build (e.g. a backend auto-disable warning); fails if absent
#   build_only    -> cross-compiled leg: build, skip the test and assert steps
#   multiarch     -> enable sccache's multi-arch caching on this leg (macOS
#                    universal; adopt per leg on evidence — see cmake-build)
#   dualarch      -> binaryDir leaf; after the native ctest run, every test_*
#                    binary in <dualarch>/test additionally runs under
#                    `arch -x86_64` (Rosetta) on non-PR events
#
# Vendored from tanh-lab/ci-actions (see docs/ci.md): the steps use the
# composite actions in ./.github/actions of the SAME commit, so there is no pin to bump.

on:
  workflow_call:
    inputs:
      tier:
        description: "Matrix tier: '' derives from the event (pull_request -> pr, else full); or 'pr' / 'full'"
        type: string
        default: ""
      matrix_file:
        description: "Caller-relative path of the matrix JSON"
        type: string
        default: ".github/build_test_matrix.json"
      models_cache_prefix:
        description: "Cache-key prefix for pre-fetched fixture trees; the full key is <prefix>-hashFiles(models_hash_glob). Empty skips the restore. (hashFiles is step-scoped, so callers cannot compute the key themselves.)"
        type: string
        default: ""
      models_hash_glob:
        description: "File pattern hashed into the models cache key (e.g. the pin manifest)"
        type: string
        default: ""
      models_cache_paths:
        description: "Newline-separated cache paths matching the key"
        type: string
        default: ""
      models_lfs_include:
        description: "git lfs pull --include pattern for models tracked in Git LFS: on a cache miss the plan job pulls them and saves the cache (.github/actions/models-cache). Empty: restore only."
        type: string
        default: ""

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"
jobs:
  plan:
    name: plan (build_test)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: models
        if: inputs.models_cache_prefix != '' && inputs.models_lfs_include != ''
        uses: ./.github/actions/models-cache
        with:
          CACHE_PREFIX: ${{ inputs.models_cache_prefix }}
          HASH_GLOB: ${{ inputs.models_hash_glob }}
          PATHS: ${{ inputs.models_cache_paths }}
          LFS_INCLUDE: ${{ inputs.models_lfs_include }}
          SAVE: "true"
      - name: select the tier
        id: tier
        shell: bash
        run: |
          TIER="${{ inputs.tier }}"
          if [ -z "$TIER" ]; then
            TIER="full"
            if [ "${{ github.event_name }}" = "pull_request" ]; then TIER="pr"; fi
          fi
          echo "Tier: $TIER"
          echo "matrix=$(jq -c --arg tier "$TIER" '[ .[] | select($tier != "pr" or .pr == true) ]' "${{ inputs.matrix_file }}")" >> "$GITHUB_OUTPUT"

  build_test:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated release-API checks in caller CMake
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: models
        if: inputs.models_cache_prefix != ''
        uses: ./.github/actions/models-cache
        with:
          CACHE_PREFIX: ${{ inputs.models_cache_prefix }}
          HASH_GLOB: ${{ inputs.models_hash_glob }}
          PATHS: ${{ inputs.models_cache_paths }}
          LFS_INCLUDE: ${{ inputs.models_lfs_include }}
          SAVE: "false"
      - name: setup build tools
        uses: ./.github/actions/setup-cpp-build-tools
      # Ninja needs cl.exe and its headers/libs from a vcvars environment.
      - name: MSVC environment
        if: matrix.vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: build
        uses: ./.github/actions/cmake-build
        with:
          PRESET: ${{ matrix.preset }}
          CMAKE_BUILD_ARGS: ${{ matrix.args }}
          SCCACHE_MULTIARCH: ${{ matrix.multiarch && '1' || '' }}
      - name: assert on the configure log
        if: matrix.assert_grep && !matrix.build_only
        shell: bash
        run: grep -qF "${{ matrix.assert_grep }}" configure.log
      - name: test
        if: ${{ !matrix.build_only }}
        uses: ./.github/actions/cmake-test
        with:
          PRESET: ${{ matrix.preset }}
      - name: test the x86_64 slice under Rosetta
        # Universal legs run the suite twice on one runner — an x86_64 process
        # spawns fat children as x86_64, so the second slice executes without a
        # second macOS job.
        if: matrix.dualarch && github.event_name != 'pull_request'
        shell: bash
        run: |
          rc=0
          found=0
          for t in "${{ matrix.dualarch }}"/test/test_*; do
            [ -f "$t" ] && [ -x "$t" ] || continue
            found=1
            arch -x86_64 "$t" --gtest_brief=1 || rc=1
          done
          # An empty glob must fail: this step is the leg's only x86_64 run.
          [ "$found" = 1 ] || { echo "::error::no test binaries under ${{ matrix.dualarch }}/test"; exit 1; }
          exit $rc

  # The queue's required status — per-leg names change with the tier, so
  # requiring them directly would leave PRs pending forever.
  result:
    name: build_test result
    needs: [plan, build_test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "matrix result: ${{ needs.build_test.result }}"
          [ "${{ needs.build_test.result }}" = "success" ] || exit 1
