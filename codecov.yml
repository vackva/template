# Coverage is measured by .github/workflows/coverage.yml (clang source-based coverage
# over the shared library + test binaries, uploaded as lcov). llvm-cov already drops
# test/, build/ and fetched code (reusable-coverage.yml, ignore_regex).
#
# The merge gate is CI's own per-file check (every changed file under src/ or
# include/ >= 80%, the "coverage result" check). Codecov adds the patch view:
# the codecov/patch status compares all changed lines together against 80%.
coverage:
  status:
    project: off
    patch:
      default:
        target: 80%
        threshold: 0%

comment:
  layout: "diff, files"
  require_changes: false

github_checks:
  annotations: true
